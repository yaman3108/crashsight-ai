# CrashSight AI — Default YOLOv8m Training Configuration
# See: docs/architecture.md § 6.4

model: yolov8m.pt           # Medium variant — balance of speed and accuracy
epochs: 50
batch_size: 16
image_size: 512
optimizer: AdamW
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005
augment: true
conf_threshold: 0.40        # Detection confidence threshold
iou_threshold: 0.45         # NMS IoU threshold

# Transfer learning
freeze_backbone_epochs: 10  # Freeze backbone for first N epochs
lr_schedule: cosine          # Cosine annealing

# Dataset paths (update these)
train_data: data/processed/train/
val_data: data/processed/val/
test_data: data/processed/test/

# Classes
num_classes: 10
class_names:
  - PLANE_FOREST
  - PLANE_WATER
  - PLANE_OPEN_TERRAIN
  - SHIP_SHALLOW_WATER
  - SHIP_REEF_COASTAL
  - CAR_SUBMERGED
  - CAR_CLIFF_RAVINE
  - TRAIN_DERAILMENT
  - HELICOPTER_CRASH
  - MILITARY_WRECK
